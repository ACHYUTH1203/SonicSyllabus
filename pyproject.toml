[tool.poetry]
name = "sonicsyllabus"
version = "0.1.0"
description = "AI Audio Mentor for UPSC aspirants"
authors = ["Achyuth <achyuthrayal2@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
langchain = "^0.3.0"
langchain-openai = "^0.2.0"
langchain-community = "^0.3.0"
langgraph = "^0.2.0"
openai = "^1.50.0"
pypdf = "^5.0.0"
chromadb = ">=0.5.0"
python-dotenv = "^1.0.1"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
pydantic = "^2.9.0"
pandas = "^2.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
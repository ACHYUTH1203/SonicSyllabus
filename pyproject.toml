[tool.poetry]
name = "sonicsyllabus"
version = "0.1.0"
description = "AI Audio Mentor for UPSC aspirants"
authors = ["Achyuth <achyuthrayal2@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
langchain = ">=1.2.15,<2.0.0"
langchain-openai = ">=1.1.12,<2.0.0"
langchain-community = ">=0.4.1,<0.5.0"
pypdf = ">=6.9.2,<7.0.0"
chromadb = ">=0.5.0"
python-dotenv = ">=1.2.2,<2.0.0"
langgraph = ">=1.1.6,<2.0.0"
openai = ">=1.30.0,<2.0.0"
pandas = ">=2.0.0,<3.0.0"
datasets = ">=2.15.0"
ragas = ">=0.1.0"
fastapi = ">=0.100.0"
uvicorn = ">=0.23.0"
pydantic = ">=2.0.0,<3.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
